name: Prototype

# Temporary (WP-02): runs the prototype checks on the three browsers and prints what they saw.
# Removed before the prototype PR is merged.
on:
  pull_request:
    paths: ['prototype/**', '.github/workflows/prototype.yml']

permissions:
  contents: read

jobs:
  prototype:
    name: Prototype (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm exec playwright test -c prototype --project chromium --project firefox --project webkit --timeout 30000
      - if: always()
        shell: bash
        run: for f in prototype/results/*.jsonl; do echo "== $f"; cat "$f"; done
