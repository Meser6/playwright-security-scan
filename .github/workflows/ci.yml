name: CI

# Every pull request and push to main (13-REQ-05):
# - checks: lint, format, types, AC coverage, build, package checks;
# - test: unit, contract and integration tests with Chromium on three cells;
# - browsers: integration and quality tests in Firefox and WebKit (informational);
# - attack: the ZAP active scan on the reference app, on main and by hand (informational, 19).

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the same checks on the tagged commit (13-REQ-10).
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm check:types-generated
      - run: pnpm check:rule-fixtures
      - run: pnpm check:docs-generated
      - run: pnpm check:ac
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm attw

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }}, Playwright ${{ matrix.playwright }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: 22, playwright: minimum }
          - { os: ubuntu-24.04, node: 24, playwright: latest }
          - { os: windows-latest, node: 24, playwright: latest }
          # Informational (13-REQ-05): not a required check.
          - { os: macos-latest, node: 24, playwright: latest, informational: true }
    continue-on-error: ${{ matrix.informational == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # "minimum" is the pinned dev dependency (the lowest supported version).
      - name: Install the latest Playwright
        if: matrix.playwright == 'latest'
        shell: bash
        run: pnpm add --save-dev --save-exact @playwright/test@latest
      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm build
      - run: pnpm test

  # Informational (10-AC-01, 13-REQ-05): the integration and quality tests in Firefox and WebKit,
  # best effort; not a required check. Known engine differences are listed in the spec (10).
  browsers:
    name: Browsers (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm build
      - run: pnpm vitest run test/integration test/quality
        env:
          TEST_BROWSER: ${{ matrix.browser }}

  # Informational (19, chapter 11; 13-REQ-05): the attack mode with a real ZAP container against
  # the reference app on localhost (Docker uses --network host on Linux). On main and by hand only.
  attack:
    name: Attack (zap)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker pull zaproxy/zap-stable
      - run: pnpm build
      - run: pnpm vitest run test/integration/attack.test.ts
        env:
          ZAP_TEST: '1'
      - name: No ZAP container is left (19-AC-04)
        if: always()
        run: test -z "$(docker ps -q --filter name=pw-sec-zap-)"
